# This container only ever listens on plain HTTP (port 80) - TLS is expected to be terminated
# by an external reverse proxy/load balancer in front of it. That proxy sets its own
# X-Forwarded-Proto to "https"; overwriting it with $scheme here (always "http", since this
# nginx never sees TLS itself) would erase that and make the backend think every request is
# plaintext, so it'd never mark the session/CSRF cookies Secure. This falls back to $scheme
# only when no upstream proxy already set the header (e.g. local/direct access).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend: the browser only ever talks to
    # this nginx origin, so the session/CSRF cookies stay first-party and no
    # CORS configuration is needed for real browser traffic.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Angular SPA with client-side routing - unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
