spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/battleoftheuniverse}
    username: ${DB_USERNAME:battleoftheuniverse}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  # TLS is terminated in front of this app (reverse proxy/load balancer), which forwards
  # X-Forwarded-Proto/-Host/-For. Without this, Spring never sees the request as secure, so it
  # can't mark the session/CSRF cookies Secure and would build http:// URLs even behind HTTPS.
  forward-headers-strategy: framework

game:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
